name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # botão "Run workflow" na aba Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk PTGravador-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PTGravador-APK
          path: PTGravador-v*.apk
